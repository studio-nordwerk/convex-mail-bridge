# TLS in front of the bridge. Plain TCP behind it, with the client address in a PROXY protocol
# header (v2). /certs/mail.pem holds the certificate chain followed by the private key; renewing
# it is up to you (reload HAProxy afterwards).

global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # Mail clients keep an IMAP connection silent in IDLE for up to 29 minutes.
    timeout client 35m
    timeout server 35m

frontend imaps
    bind :993 ssl crt /certs/mail.pem
    default_backend bridge_imap

frontend submissions
    bind :465 ssl crt /certs/mail.pem
    default_backend bridge_smtp

backend bridge_imap
    server bridge bridge:1143 send-proxy-v2

backend bridge_smtp
    server bridge bridge:1465 send-proxy-v2
