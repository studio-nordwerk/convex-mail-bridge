<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 0 800 700" width="1600" height="1400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" color="#1b1c19">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1c19"/></marker></defs>
<rect x="-80" y="0" width="800" height="700" fill="#f8f7f3"/>
<text x="10" y="52" font-size="26" font-weight="700" fill="#1b1c19">IMAP without a mail server</text>
<text x="10" y="78" font-size="13.5" fill="#666a60">A stateless bridge translates IMAP and SMTP into HTTP calls to the app backend.</text>
<g transform="translate(0,100)">
<g fill="none" stroke="currentColor" stroke-width="1.2">
<rect x="200" y="20" width="240" height="56" rx="8"/><rect x="200" y="130" width="240" height="56" rx="8"/>
<rect x="200" y="240" width="240" height="66" rx="8" stroke="#1f7a4d" stroke-width="2" fill="#e6f3ec"/>
<rect x="200" y="360" width="240" height="56" rx="8"/><rect x="235" y="470" width="170" height="66" rx="8"/>
<rect x="10" y="470" width="170" height="66" rx="8" stroke-dasharray="4 4"/><rect x="460" y="470" width="170" height="66" rx="8" stroke-dasharray="4 4"/>
<line x1="320" y1="76" x2="320" y2="128" marker-end="url(#arrow)"/><line x1="320" y1="186" x2="320" y2="238" marker-end="url(#arrow)"/>
<line x1="320" y1="306" x2="320" y2="358" marker-end="url(#arrow)"/><line x1="320" y1="416" x2="320" y2="468" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="180" y1="503" x2="233" y2="503" marker-end="url(#arrow)"/><line x1="405" y1="503" x2="458" y2="503" marker-end="url(#arrow)"/>
</g>
<g fill="currentColor" font-size="14" font-weight="700" text-anchor="middle">
<text x="320" y="46">Mail client</text><text x="320" y="156">TLS proxy</text><text x="320" y="268" fill="#17603c">IMAP/SMTP bridge (Go)</text><text x="320" y="386">HTTP API in Convex</text>
<text x="320" y="498">Mail data in Convex</text><text x="95" y="498">Inbound</text><text x="545" y="498">Outbound</text></g>
<g fill="#666a60" font-size="12" text-anchor="middle">
<text x="320" y="64">Apple Mail, Thunderbird, Outlook</text><text x="320" y="174">Fly, Hetzner or your own server</text><text x="320" y="287" fill="#17603c">stateless, no storage of its own</text>
<text x="320" y="404">HTTP routes /bridge/v1/…</text><text x="320" y="517">messages, UIDs, flags</text><text x="95" y="517">your mail routing</text><text x="545" y="517">your sending API</text></g>
<g fill="currentColor" font-size="12" text-anchor="start">
<text x="334" y="100">IMAP 993 · SMTP 465</text><text x="334" y="116" fill="#666a60">encrypted, per-device password</text>
<text x="334" y="210">plaintext on the private network</text><text x="334" y="226" fill="#666a60">PROXY header carries the client IP</text>
<text x="334" y="330">HTTPS + shared secret</text><text x="334" y="346" fill="#666a60">one session token per connection</text><text x="334" y="446">reads and writes</text></g>
</g>
</svg>
