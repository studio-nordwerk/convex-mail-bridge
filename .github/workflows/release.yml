# Publishes the package to npm and creates the GitHub release when a tag v<version> is pushed:
#   (bump package.json and CHANGELOG.md, commit)
#   git tag -a v<version> -m "<version>" && git push --follow-tags
# npm authenticates this workflow as a trusted publisher (OIDC), so no token is stored; the
# package's settings on npmjs.com name this repository and this workflow file. The first version
# is published by hand, as npm only trusts a publisher for an existing package; its tag then only
# creates the GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches the version in package.json
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - name: Publish unless this version is on npm already
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "$(node -p "require('./package.json').name")@$VERSION" version >/dev/null 2>&1; then
            echo "Already published"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release with the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v {on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file notes.md
